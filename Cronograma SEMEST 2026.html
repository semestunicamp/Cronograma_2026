<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma SEMEST 2026</title>
<style>
:root{--bg:#faf7fc;--card:#fff;--ink:#2b1a38;--mut:#6f607d;--line:#e6dcee;--pri:#774596;--soft:#f1e9f6;--warn:#fff3c4;--warnink:#7a5b00;--live:#4f9d43;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#774596,#5c3377);padding:16px 16px 12px;color:#fff}
.logo{margin-bottom:10px}
.logo img{display:block;height:40px;width:auto}
header h1{margin:0;font-size:20px;color:#fff}
header p{margin:2px 0 0;color:#eadcf3;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 40px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 6px}
.tabs,.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tab,.chip,.fav,.search{font:inherit;color:var(--ink)}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 14px;text-align:center;cursor:pointer}
.tab small{display:block;color:var(--mut);font-size:12px}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tab.on small{color:#eadcf3}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin:4px 0 8px}
.chip,.fav{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on,.fav.on{background:var(--soft);border-color:var(--pri);color:var(--pri);font-weight:600}
.dh{font-size:15px;color:var(--mut);margin:16px 2px 8px;font-weight:600}
.c{display:grid;grid-template-columns:58px 1fr auto;gap:10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:14px;padding:12px;margin-bottom:10px}
.c.roda{border-left-color:var(--live)}
.c.geral,.c.pausa,.c.din{border-left-color:var(--line);background:transparent;padding:8px 12px}
.c.live{outline:2px solid var(--live)}
.tm{display:flex;flex-direction:column;font-size:14px}
.tm b{font-size:16px}
.tm span{color:var(--mut)}
.tp{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--pri);font-weight:700;margin-bottom:2px}
.bd h3{margin:0;font-size:17px;line-height:1.25}
.c.geral h3,.c.pausa h3,.c.din h3{font-size:15px;font-weight:500;color:var(--mut)}
.sp{margin:2px 0 0;color:var(--mut);font-size:14px}
.th{margin:6px 0 0;font-weight:700;color:var(--mut)}
.th:not(.m)::before{content:"“"}
.th:not(.m)::after{content:"”"}
.th.m{color:var(--mut);font-style:italic;font-weight:400}
.bio{margin:8px 0 0;font-size:14px;line-height:1.4}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:11px;text-transform:none;letter-spacing:0}
.tag.w{background:var(--warn);color:var(--warnink)}
.tag.l{background:var(--live);color:#fff}
.li{display:inline-block;margin:8px 6px 0 0;padding:4px 12px;border-radius:999px;background:#0a66c2;color:#fff;text-decoration:none;font-size:14px}
.st{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--mut);align-self:start}
.st.on{color:#f0a500}
.cal{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cal a{padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--pri);text-decoration:none;background:var(--card)}
.empty{text-align:center;color:var(--mut);margin:40px 0}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:24px}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const isTalk=t=>t==="palestra"||t==="oficina"||t==="roda";
const GROUPS={all:null,talk:["palestra","roda"],oficina:["oficina"],outros:["geral","pausa","din"]};
const CHIPS=[["all","Tudo"],["talk","Palestras e rodas"],["oficina","Oficinas"],["outros","Intervalos e dinâmicas"]];

let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("semest26_favs")||"[]"))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("semest26_favs",JSON.stringify([...favs]))}catch(e){}};

const today=new Date();
const startDay=(today.getFullYear()===2026&&today.getMonth()===9&&DAYS.some(d=>d.id===String(today.getDate()).padStart(2,"0")))
  ?String(today.getDate()).padStart(2,"0"):"21";
const state={day:startDay,q:"",f:"all",fav:false};

const at=(d,hm)=>{const[h,m]=hm.split(":").map(Number);return new Date(2026,9,+d,h,m)};
const isLive=e=>{const n=new Date();return n>=at(e.d,e.s)&&n<at(e.d,e.e)};

function ok(e){
  const g=GROUPS[state.f];
  if(g&&!g.includes(e.t))return false;
  if(state.fav&&!favs.has(e.d+"-"+e.s))return false;
  if(state.q){
    const day=DAYS.find(d=>d.id===e.d);
    const hay=norm([e.org,e.theme,e.speaker,e.bio,LABEL[e.t],day.full,day.date].join(" "));
    if(!hay.includes(norm(state.q)))return false;
  }
  return true;
}

function placeOf(e){return e.t==="oficina"?"":"Auditório do IMECC - UNICAMP"}
function calLinks(e){
  const loc=placeOf(e);
  const title="SEMEST 2026 · "+((e.hero&&e.speaker)?e.speaker:(e.org||e.speaker||"Atividade"));
  const det=[e.theme,e.speaker&&e.org?(e.t==="roda"?"Participantes: ":"Palestrante: ")+e.speaker:""].filter(Boolean).join("\n");
  const g="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&details="+encodeURIComponent(det)+"&location="+encodeURIComponent(loc)+"&ctz=America%2FSao_Paulo&dates=202610"+e.d+"T"+e.s.replace(":","")+"00/202610"+e.d+"T"+e.e.replace(":","")+"00";
  const o="https://outlook.live.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject="+encodeURIComponent(title)+"&body="+encodeURIComponent(det)+"&location="+encodeURIComponent(loc)+"&startdt="+encodeURIComponent("2026-10-"+e.d+"T"+e.s+":00-03:00")+"&enddt="+encodeURIComponent("2026-10-"+e.d+"T"+e.e+":00-03:00");
  return `<div class="cal"><a href="${esc(g)}" target="_blank" rel="noopener">+ Google Agenda</a><a href="${esc(o)}" target="_blank" rel="noopener">+ Outlook</a></div>`;
}

function card(e){
  const k=e.d+"-"+e.s,talk=isTalk(e.t),main=e.hero&&e.speaker?e.speaker:(e.org||e.speaker||"A definir");
  const sub=e.hero&&e.speaker?e.org:(e.org&&e.speaker?(e.t==="roda"?"Com ":"")+e.speaker:"");
  const live=isLive(e);
  return `<article class="c ${e.t}${live?" live":""}">
    <div class="tm"><b>${e.s}</b><span>${e.e}</span></div>
    <div class="bd">
      ${talk?`<div class="tp">${LABEL[e.t]}${e.tbc?'<span class="tag w">A confirmar</span>':''}${live?'<span class="tag l">Agora</span>':''}</div>`:""}
      <h3>${esc(main)}</h3>
      ${sub?`<p class="sp">${esc(sub)}</p>`:""}
      ${e.theme||(e.t==="palestra"&&!e.speaker)?`<p class="th${e.theme?"":" m"}">${e.theme?esc(e.theme):"Tema a definir"}</p>`:""}
      ${e.bio?`<p class="bio">${esc(e.bio)}</p>`:""}
      ${talk?`<p class="sp">📍 ${placeOf(e)?esc(placeOf(e)):"Local a definir"}</p>`:""}
      ${(Array.isArray(e.li)?e.li:(e.li?[["LinkedIn",e.li]]:[])).map(([l,u])=>`<a class="li" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join(" ")}
      ${talk?calLinks(e):""}
    </div>
    ${talk?`<button class="st${favs.has(k)?" on":""}" data-k="${k}" aria-label="Favoritar" aria-pressed="${favs.has(k)}">${favs.has(k)?"★":"☆"}</button>`:"<span></span>"}
  </article>`;
}

function renderTabs(){
  $("#tabs").innerHTML=DAYS.map(d=>`<button class="tab${d.id===state.day&&!state.q&&!state.fav?" on":""}" data-d="${d.id}">${d.wd}<small>${d.date}</small></button>`).join("");
  $("#chips").innerHTML=CHIPS.map(([k,l])=>`<button class="chip${state.f===k?" on":""}" data-f="${k}">${l}</button>`).join("")
    +`<button class="fav${state.fav?" on":""}" id="favbtn">★ Minha agenda (${favs.size})</button>`;
}

function render(){
  const all=state.q||state.fav;
  let html="";
  for(const d of (all?DAYS:DAYS.filter(x=>x.id===state.day))){
    const list=EV.filter(e=>e.d===d.id&&ok(e));
    if(!list.length)continue;
    html+=`<h2 class="dh">${d.full} · ${d.date}</h2>`+list.map(card).join("");
  }
  $("#list").innerHTML=html||`<p class="empty">${state.fav?"Você ainda não favoritou nada. Toque na ☆ de uma palestra.":"Nada encontrado."}</p>`;
  renderTabs();
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("button");if(!t)return;
  if(t.dataset.d){state.day=t.dataset.d;state.q="";state.fav=false;$("#q").value="";}
  else if(t.dataset.f){state.f=t.dataset.f;}
  else if(t.id==="favbtn"){state.fav=!state.fav;}
  else if(t.dataset.k){const k=t.dataset.k;favs.has(k)?favs.delete(k):favs.add(k);saveFavs();}
  else return;
  render();
});
$("#q").addEventListener("input",e=>{state.q=e.target.value.trim();render();});
render();
setInterval(render,60000);
</script>
</body>
</html>
